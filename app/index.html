<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#30a46c" />
    
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Finanças</title>
    <script>
      // Tema escolhido em Ajustes (ver src/ui/tema.ts) — aplicado antes de desenhar, para não piscar.
      try {
        var t = localStorage.getItem('financas-tema');
        if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
